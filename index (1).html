<!DOCTYPE html>
<html lang="uz" data-theme="night">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auto Tasbeh</title>
<meta name="theme-color" content="#000000">
<style>
:root{--bg:#000;--tx:#fff;--pn:rgba(0,0,0,.6);--sp:#0f1a1f;--ch:rgba(255,255,255,.12);--gold:#e8c15a;--turq:#19b6c4;--green:#2ecc71;--red:#e5234d;--po:1;--p:0}
:root[data-theme=day]{--bg:#cfe7f3;--gold:#b36b00;--tx:#13232a;--pn:rgba(255,255,255,.75);--sp:#fff;--ch:rgba(0,0,0,.09);--po:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:system-ui,sans-serif;color:var(--tx);background:var(--bg);min-height:100vh;display:flex;justify-content:center;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);transition:background .3s}
.bgp{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:var(--po)}
.gear{position:fixed;z-index:5;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;width:48px;height:48px;border-radius:16px;border:0;background:var(--pn);color:var(--tx);font-size:1.5rem;backdrop-filter:blur(8px);box-shadow:0 4px 16px #0005;cursor:pointer;padding:0}
.snd{width:auto;right:72px;padding:0 14px;font-size:1rem}
.main{position:relative;z-index:1;width:100%;max-width:440px;padding:70px 14px 28px;text-align:center}
h1{margin:0 0 34px;font-size:2.4rem;color:var(--gold);text-shadow:0 0 14px var(--bg),0 0 4px var(--bg)}
.ringwrap{position:relative;width:min(68vw,290px);aspect-ratio:1;margin:0 auto}
.ring{width:100%;height:100%;border-radius:50%;background:conic-gradient(var(--turq),var(--gold) calc(var(--p)*1%),var(--ch) 0);display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;box-shadow:0 0 34px rgba(25,182,196,.4)}
.inner{width:84%;height:84%;border-radius:50%;background:radial-gradient(circle,#0b2027,#030c10);display:flex;align-items:center;justify-content:center}
.count{font-size:4rem;font-weight:800;color:var(--gold);text-shadow:0 0 18px rgba(232,193,90,.6)}
.badge{position:absolute;top:-17px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,var(--turq),#2a5bd7);color:#fff;padding:6px 16px;border-radius:14px;font-weight:700;font-size:.95rem;box-shadow:0 0 16px rgba(25,182,196,.6)}
.ctl{margin-top:34px;padding:18px 14px;border-radius:28px;background:var(--pn);backdrop-filter:blur(8px)}
.ctl h2{margin:0 0 14px;font-size:1.25rem}
.row{display:flex;gap:9px;align-items:center}
button{font:inherit;font-weight:700;font-size:1rem;border:0;border-radius:16px;padding:13px 12px;color:var(--tx);background:var(--ch);cursor:pointer;transition:.2s}
.row>button{flex:1}
button.on{background:var(--green);color:#032;box-shadow:0 0 18px rgba(46,204,113,.6)}
button.reset{background:var(--red);color:#fff}
.ok{background:linear-gradient(135deg,var(--gold),#b8862b);color:#2b1b00}
.bottom{margin-top:14px}
input[type=number]{min-width:0;padding:12px;border:0;border-radius:14px;background:var(--ch);color:var(--tx);font-size:1.15rem;text-align:center;font-weight:700}
.bottom input{flex:1}
.ov{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:none}
.ov.open{display:block}
.sheet{position:absolute;top:calc(env(safe-area-inset-top,0px) + 68px);right:12px;width:min(92vw,360px);max-height:80vh;overflow:auto;padding:18px;border-radius:26px;background:var(--sp);color:var(--tx);box-shadow:0 20px 60px #000a}
.sheet h3{margin:0 0 14px;font-size:1.3rem;color:var(--gold)}
.sheet label{display:block;margin:16px 0 8px;font-size:.9rem;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 14px;font-size:.95rem}
.sp{display:flex;gap:8px;align-items:center}
.sp input[type=number]{width:84px}
input[type=range]{flex:1;accent-color:var(--turq)}
.x{width:100%;margin-top:18px;background:linear-gradient(135deg,var(--gold),#b8862b);color:#2b1b00}
</style>
</head>
<body>
<svg class="bgp" id="bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
<button class="gear snd on" id="snd">🔊 ON</button>
<button class="gear" id="gear" aria-label="Sozlamalar">⚙</button>

<div class="main">
  <h1>Auto Tasbeh</h1>
  <div class="ringwrap">
    <div class="badge" id="pct">0%</div>
    <div class="ring" id="ring"><div class="inner"><div class="count" id="count">0</div></div></div>
  </div>
  <div class="ctl">
    <h2>Avtomatik hisoblash</h2>
    <div class="row">
      <button id="start">Boshlash</button>
      <button id="pause">To’xtash</button>
      <button id="reset" class="reset">O’chirish</button>
    </div>
  </div>
</div>

<div class="ov" id="ov">
  <div class="sheet" id="sheet">
    <h3>Sozlamalar</h3>
    <label>1. Vaqt tezligi (soniya)</label>
    <div class="sp"><input type="number" id="sec" step="0.1" min="0.1" max="60" value="1" inputmode="decimal"><input type="range" id="speed" min="0.1" max="5" step="0.1" value="1"></div>
    <label>2. Orqa fon rangi</label>
    <div class="chips"><button id="tn">🌙 Tungi</button><button id="tk">☀️ Kunduzgi</button></div>
    <label>3. Ovoz tanlash</label>
    <div class="chips" id="sounds"></div>
    <label>4. Vibratsiya</label>
    <div class="chips"><button id="vib">📳 ON</button></div>
    <label>5. Tasbeh soni</label>
    <div class="sp"><input type="number" id="target" value="100" min="1" inputmode="numeric"><button class="ok" id="ok">OK</button></div>
    <button class="x" id="close">Tayyor</button>
  </div>
</div>

<script>
var count = 0, target = 100, timer = null, soundOn = true, ctx = null, mode = "idle";
var S = {theme: "night", snd: "tak", vib: true};
var SND = {tak:["Tak","triangle",900,250,.1,.2], tuk:["Tuk","sine",320,110,.13,.45], klik:["Klik","square",1600,1200,.04,.08], qong:["Qo’ng’iroq","sine",1300,1250,.4,.25], tomchi:["Tomchi","sine",500,1100,.09,.3]};
var $ = function(id){ return document.getElementById(id); };

// Orqa fon: tungi osmon (oy va yulduzlar) va kunduzgi tong (nur)
var lastBg = "";
function drawBg(){
  if (lastBg === S.theme) return; lastBg = S.theme;
  var h = "", i, seed = 7;
  function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  if (S.theme === "night") {
    h = '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#01030c"/><stop offset=".6" stop-color="#071a3a"/><stop offset="1" stop-color="#14366a"/></linearGradient>' +
      '<radialGradient id="mg"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>' +
      '<mask id="m"><rect width="400" height="800" fill="#fff"/><circle cx="320" cy="98" r="40" fill="#000"/></mask></defs>' +
      '<rect width="400" height="800" fill="url(#g)"/><circle cx="300" cy="110" r="140" fill="url(#mg)"/>' +
      '<circle cx="300" cy="110" r="42" fill="#fff3b8" mask="url(#m)"/>';
    for (i = 0; i < 90; i++) {
      h += '<circle cx="' + (rnd()*400).toFixed(0) + '" cy="' + (rnd()*800).toFixed(0) + '" r="' + (0.6 + rnd()*1.5).toFixed(1) + '" fill="#fff"><animate attributeName="opacity" values="1;.2;1" dur="' + (2 + rnd()*3).toFixed(1) + 's" begin="-' + (rnd()*4).toFixed(1) + 's" repeatCount="indefinite"/></circle>';
    }
    for (i = 0; i < 9; i++) {
      h += '<path d="M0-10Q1-1 10 0Q1 1 0 10Q-1 1-10 0Q-1-1 0-10Z" fill="#fff6c8" transform="translate(' + (rnd()*380+10).toFixed(0) + ' ' + (rnd()*700+20).toFixed(0) + ') scale(' + (0.7 + rnd()).toFixed(1) + ')"><animate attributeName="opacity" values="1;.3;1" dur="' + (3 + rnd()*3).toFixed(1) + 's" repeatCount="indefinite"/></path>';
    }
  } else {
    function lg(id, c1, c2){ return '<linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + c1 + '"/><stop offset="1" stop-color="' + c2 + '"/></linearGradient>'; }
    h = '<defs>' + lg("g", "#4f9fe0", "#ffd6a0").replace('<stop offset="1"', '<stop offset=".4" stop-color="#bfe3f5"/><stop offset=".62" stop-color="#fde7c3"/><stop offset="1"') +
      '<radialGradient id="sg"><stop offset="0" stop-color="#fffbe6"/><stop offset=".2" stop-color="#ffe9a0" stop-opacity=".85"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient>' +
      lg("m1", "#7fa4c8", "#b5cfe0") + lg("m2", "#5d9a95", "#3f7f66") + lg("m3", "#3f8a52", "#2a6b3e") +
      '<linearGradient id="hz" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0d0" stop-opacity="0"/><stop offset=".5" stop-color="#fff0d0" stop-opacity=".55"/><stop offset="1" stop-color="#fff0d0" stop-opacity="0"/></linearGradient>' +
      '<filter id="bl"><feGaussianBlur stdDeviation="4"/></filter></defs>' +
      '<rect width="400" height="800" fill="url(#g)"/><circle cx="330" cy="415" r="300" fill="url(#sg)"/><g transform="translate(330 415)" filter="url(#bl)">';
    for (i = 0; i < 9; i++) h += '<path d="M0 0L-26 -1000L26 -1000Z" fill="#fff" opacity=".11" transform="rotate(' + (i*20 - 80) + ')"/>';
    h += '</g><circle cx="330" cy="415" r="24" fill="#fffbe6"/>' +
      '<path d="M0 560V480L55 420L95 450L150 365L205 450L250 405L300 455L360 440L400 465V560Z" fill="url(#m1)" stroke="#9db9d3" stroke-linejoin="round"/>' +
      '<path d="M150 365L128 396L142 389L150 402L160 388L172 396Z" fill="#fff" opacity=".9"/><path d="M250 405L235 428L245 423L252 432L260 422L268 430Z" fill="#fff" opacity=".9"/>' +
      '<rect y="430" width="400" height="170" fill="url(#hz)"/>' +
      '<path d="M0 800V560C70 520 130 545 200 565S320 540 400 570V800Z" fill="url(#m2)"/>';
    for (i = 0; i < 14; i++) { var px = rnd()*400, py = 575 + rnd()*20, sc = 0.6 + rnd()*0.6;
      h += '<g transform="translate(' + px.toFixed(0) + ' ' + py.toFixed(0) + ') scale(' + sc.toFixed(2) + ')"><path d="M0-30L10-12H5L13 0H-13L-5-12H-10Z" fill="#1e5b45"/></g>'; }
    h += '<path d="M0 800V630C90 600 170 650 260 630S350 610 400 635V800Z" fill="url(#m3)"/>';
    for (i = 0; i < 12; i++) { var tx = i*34 + rnd()*20, ty = 640 + rnd()*12, ts = 0.7 + rnd()*0.4;
      h += '<g transform="translate(' + tx.toFixed(0) + ' ' + ty.toFixed(0) + ') scale(' + ts.toFixed(2) + ')"><rect x="-2" y="-4" width="4" height="16" fill="#5b3a22"/><circle cy="-10" r="14" fill="#1f6a3a"/><circle cx="-4" cy="-14" r="8" fill="#37a05a" opacity=".8"/></g>'; }
    h += '<path d="M0 800V715C100 685 200 735 300 705S370 700 400 715V800Z" fill="#2b7340"/>';
    var fc = ["#ffffff", "#ffd1e0", "#ffe36b", "#ff9bb8"];
    for (i = 0; i < 50; i++) h += '<circle cx="' + (rnd()*400).toFixed(0) + '" cy="' + (735 + rnd()*60).toFixed(0) + '" r="' + (1.5 + rnd()).toFixed(1) + '" fill="' + fc[i % 4] + '" opacity=".9"/>';
  }
  $("bg").innerHTML = h;
}

function save(){ try { localStorage.setItem("tasbeh4", JSON.stringify({count:count,target:target,sound:soundOn,sec:$("sec").value,S:S})); } catch(e){} }
function load(){
  try {
    var d = JSON.parse(localStorage.getItem("tasbeh4") || "null");
    if (d) { count = d.count||0; target = d.target||100; soundOn = d.sound!==false; $("sec").value = d.sec||1; $("speed").value = Math.min(5, d.sec||1); S = d.S || S; }
  } catch(e){}
}
function getSec(){ var v = parseFloat($("sec").value); return (v > 0) ? v : 1; }
function audio(){ try { ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); } catch(e){} }
function beep(force){
  if ((!soundOn && !force) || !ctx) return;
  try {
    var a = SND[S.snd], o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime;
    o.type = a[1]; o.frequency.setValueAtTime(a[2], t); o.frequency.exponentialRampToValueAtTime(a[3], t + a[4]);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(a[5], t); g.gain.exponentialRampToValueAtTime(0.001, t + a[4]);
    o.start(); o.stop(t + a[4]);
  } catch(e){}
}
function buzz(ms){ if (S.vib && navigator.vibrate) navigator.vibrate(ms); }

function render(){
  var p = Math.min(100, Math.floor(count / target * 100));
  $("count").textContent = count;
  $("pct").textContent = p + "%";
  document.documentElement.style.setProperty("--p", Math.min(100, count / target * 100));
  document.documentElement.setAttribute("data-theme", S.theme); drawBg(); ms();
  $("target").value = target;
  $("start").className = mode === "run" ? "on" : "";
  $("pause").className = mode === "stop" ? "on" : "";
  $("snd").textContent = soundOn ? "🔊 ON" : "🔇 OFF";
  $("snd").className = soundOn ? "gear snd on" : "gear snd";
  $("tn").className = S.theme === "night" ? "on" : "";
  $("tk").className = S.theme === "day" ? "on" : "";
  $("vib").textContent = S.vib ? "📳 ON" : "📴 OFF";
  $("vib").className = S.vib ? "on" : "";
  var b = $("sounds").children;
  for (var i = 0; i < b.length; i++) b[i].className = b[i].dataset.k === S.snd ? "on" : "";
}

var runStart = 0, counted = 0, au = null;
// Ilova fonda ishlashi uchun: 1 soniyalik ovozsiz fayl aylanib turadi
function silent(){
  var n = 8000, b = new ArrayBuffer(44 + n), v = new DataView(b), i;
  function w(o, t){ for (var j = 0; j < t.length; j++) v.setUint8(o + j, t.charCodeAt(j)); }
  w(0, "RIFF"); v.setUint32(4, 36 + n, true); w(8, "WAVEfmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, "data"); v.setUint32(40, n, true);
  for (i = 0; i < n; i++) v.setUint8(44 + i, 128 + (i % 2));
  au = new Audio(URL.createObjectURL(new Blob([b], {type: "audio/wav"}))); au.loop = true;
}
function halt(){ if (timer) { clearInterval(timer); timer = null; } if (au) au.pause(); }
function check(){
  var n = Math.floor((Date.now() - runStart) / (getSec() * 1000)), c = 0;
  while (counted < n && count < target) { count++; counted++; c++; }
  if (!c) return;
  beep(); buzz(30);
  if (count >= target) { halt(); mode = "stop"; buzz(400); }
  render(); save();
}
function start(){
  audio(); halt(); if (count >= target) return;
  if (!au) silent();
  try { au.play(); } catch(e){}
  mode = "run"; runStart = Date.now(); counted = 0; timer = setInterval(check, 50); render();
}
function pause(){ halt(); mode = "stop"; render(); }
var ICON = "";
function makeIcon(){
  var c = document.createElement("canvas"), x; c.width = c.height = 256; x = c.getContext("2d");
  x.fillStyle = "#030c10"; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = "#e8c15a"; x.lineWidth = 16; x.beginPath(); x.arc(128, 128, 100, 0, 6.283); x.stroke();
  x.fillStyle = "#19b6c4"; x.beginPath(); x.arc(128, 128, 50, 0, 6.283); x.fill();
  x.fillStyle = "#e8c15a"; x.beginPath(); x.arc(128, 128, 24, 0, 6.283); x.fill();
  return c.toDataURL("image/png");
}
function ms(){
  var M = navigator.mediaSession; if (!M) return;
  if (!ICON) ICON = makeIcon();
  try {
    M.metadata = new MediaMetadata({title: "Tasbeh: " + count + " / " + target, artist: mode === "run" ? "Sanalmoqda" : (mode === "stop" ? "Pauza" : "To’xtatilgan"), album: "Auto Tasbeh", artwork: [{src: ICON, sizes: "256x256", type: "image/png"}]});
    M.playbackState = mode === "run" ? "playing" : "paused";
  } catch(e){}
}
if (navigator.mediaSession) {
  navigator.mediaSession.setActionHandler("play", start);
  navigator.mediaSession.setActionHandler("pause", pause);
  try { navigator.mediaSession.setActionHandler("stop", pause); } catch(e){}
}
document.addEventListener("visibilitychange", function(){ if (mode === "run") check(); });

for (var k in SND) { (function(k){
  var b = document.createElement("button"); b.textContent = SND[k][0]; b.dataset.k = k;
  b.onclick = function(){ S.snd = k; audio(); beep(true); render(); save(); };
  $("sounds").appendChild(b);
})(k); }

$("start").onclick = start;
$("pause").onclick = pause;
$("reset").onclick = function(){ halt(); count = 0; mode = "idle"; render(); save(); };
$("ring").onclick = function(){ audio(); if (count < target) { count++; beep(); buzz(30); render(); save(); } };
$("ok").onclick = function(){ var v = parseInt($("target").value, 10); if (v > 0) { target = v; if (count > target) count = target; render(); save(); } };
$("snd").onclick = function(){ soundOn = !soundOn; audio(); render(); save(); };
$("gear").onclick = function(){ $("ov").className = "ov open"; };
$("close").onclick = function(){ $("ov").className = "ov"; };
$("ov").onclick = function(e){ if (e.target === $("ov")) $("ov").className = "ov"; };
$("speed").oninput = function(){ $("sec").value = $("speed").value; save(); if (mode === "run") start(); };
$("sec").onchange = function(){ var v = getSec(); $("sec").value = v; $("speed").value = Math.min(5, v); save(); if (mode === "run") start(); };
$("tn").onclick = function(){ S.theme = "night"; render(); save(); };
$("tk").onclick = function(){ S.theme = "day"; render(); save(); };
$("vib").onclick = function(){ S.vib = !S.vib; buzz(60); render(); save(); };

load(); render();
</script>
</body>
</html>
